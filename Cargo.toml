[package]
name = "mercury"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[workspace]
members = [
  "crates/core-types",
  "crates/platform-traits",
  "crates/policy-engine",
  "crates/control-api",
  "crates/audit",
  "crates/kernel-matcher",
  "crates/kernel-ebpf",
  "crates/kernel-runtime",
  "crates/linux-adapter",
  "crates/daemon",
  "crates/launcher",
  "crates/cli",
  "tools/mercury-policy-patch",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.12"
ipnet = { version = "2.10", features = ["serde"] }
libc = "0.2"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
thiserror = "1.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "process", "time", "signal"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[profile.release]
panic = "abort"     # no unwinding — reduces attack surface and binary size
lto = true          # link-time optimisation; strips dead code across crates
codegen-units = 1   # single CGU for maximum LTO effectiveness
